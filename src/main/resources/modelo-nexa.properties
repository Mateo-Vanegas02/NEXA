# ===========================================================================
# Modelo NEXA v2.0: tarifa, XP y niveles (prefijo nexa.)
# Fuente: docs/niveles/NEXA_Modelo_Tarifa_XP_Niveles_v2.0.docx
# Ningun numero de negocio va en el codigo: todo se ajusta aqui.
# Mientras conviva con levels.properties (sistema anterior), este archivo es el
# que manda para la tarifa y los niveles nuevos.
# ===========================================================================

# --- Zona de servicio (seccion 1) -----------------------------------------
# Poligono aproximado del area urbana de Cartagena alcanzable en moto:
# norte hasta Manzanillo del Mar y Bayunca, sur hasta Pasacaballos, Mamonal al
# suroriente. Deja por fuera Turbaco, Tierra Bomba y Baru. Vertices "lat lng"
# separados por ";" en orden.
nexa.zona.poligono=10.545 -75.505; 10.560 -75.440; 10.545 -75.395; 10.420 -75.415; \
  10.360 -75.440; 10.300 -75.470; 10.265 -75.500; 10.270 -75.535; 10.330 -75.535; \
  10.385 -75.575; 10.430 -75.565; 10.480 -75.520
# Viaje urbano mas largo posible: Bayunca -> Pasacaballos, 30,4 km en linea
# recta (unos 39,5 km de ruta). Se rechaza cualquier ruta mas larga.
nexa.zona.distancia-max-km=40

# --- Distancia del viaje ----------------------------------------------------
# recta = linea recta x factor (fase 1). Despues se cambia por rutas reales.
nexa.rutas.proveedor=osrm
nexa.rutas.factor-recta=1.3
# Solo con nexa.rutas.proveedor=osrm. Cambiar a osrm CAMBIA la distancia cobrada (calles reales en vez de
# recta x 1,3). El servidor publico de OSRM es una demo: en produccion usa uno propio.
nexa.rutas.osrm-url=https://router.project-osrm.org
nexa.rutas.osrm-timeout-ms=2000

# --- Tarifa base (ecuacion 1) ----------------------------------------------
nexa.tarifa.banderazo=3000
nexa.tarifa.por-km=1200
nexa.tarifa.minima=4000
nexa.tarifa.redondeo=100

# --- Recargo por espera (ecuacion 2) ---------------------------------------
nexa.espera.valor-minuto=400
nexa.espera.gracia-minutos=5
nexa.espera.max-minutos=10

# --- Multiplicador (ecuaciones 3 a 6). Fase de prueba: fijo en 1.0 ----------
nexa.multiplicador.fijo=1.0
nexa.multiplicador.max=1.5

# --- Descuento por nivel y margen (ecuaciones 7, 12 y 20) ------------------
nexa.descuento.nivel-min=2
nexa.descuento.por-nivel=0.01
nexa.descuento.max=0.05
nexa.descuento.tope-viaje=800
nexa.margen.minimo=0.10
# Lo que el redondeo a $100 puede quitarle a la plataforma
nexa.margen.holgura-redondeo=50

# --- Comision por nivel del conductor, del nivel 1 al 5 (seccion 8) --------
nexa.comision.por-nivel=0.20,0.19,0.18,0.16,0.15

# --- XP por viaje (ecuaciones 14 a 17 y 26) --------------------------------
nexa.xp.fijo=2
nexa.xp.por-mil=0.46
nexa.xp.tope-tarifa=27000
nexa.xp.por-bloque=0.05
nexa.xp.tope-bloques=200
nexa.xp.factor-rodeo=2.0
nexa.xp.min-minutos=2
nexa.xp.min-km=0.5
nexa.xp.max-viajes-pareja-dia=2
# Factor de espera F(e)
nexa.xp.puntual-minutos=1
nexa.xp.factor-puntual=1.10
nexa.xp.espera-sin-penalizar=3
nexa.xp.penalizacion-minuto=0.05
nexa.xp.factor-espera-min=0.5
# Factor por viajes validos del dia A(n)
nexa.xp.viajes-dia-completos=5
nexa.xp.viajes-dia-medios=10
nexa.xp.factor-dia-medio=0.5

# --- Niveles del pasajero, sin techo (ecuaciones 18, 19 y 21) --------------
nexa.niveles.base=270
nexa.niveles.exponente=1.5
nexa.niveles.redondeo=10

# --- Conductor (ecuaciones 22 a 24) -----------------------------------------
nexa.conductor.base=400
nexa.conductor.nivel-max=5
nexa.conductor.cal-excelente=4.5
nexa.conductor.cal-buena=3.5
nexa.conductor.mult-excelente=1.2
nexa.conductor.mult-bueno=1.0
nexa.conductor.mult-bajo=0.5
# Requisitos de calidad por nivel, del 1 al 5 (0 o 1 = sin requisito)
nexa.conductor.calificacion-min=0,0,4.60,4.70,4.80
nexa.conductor.aceptacion-min=0,0,0,0.45,0.60
nexa.conductor.cancelacion-max=1,1,0.15,0.10,0.08

# --- Cancelaciones (ecuacion 25) -------------------------------------------
# Cargo = porcentaje de la tarifa base del servicio (sin tope); si el conductor ya
# llego, no baja de la espera acumulada. Se paga el cargo o la espera, nunca los dos.
nexa.cancelacion.porcentaje=0.20
nexa.cancelacion.gracia-minutos=2
nexa.cancelacion.nivel-gracia-extendida=4
nexa.cancelacion.gracia-extendida-minutos=5

# --- Llegada del conductor (espera y cancelacion) --------------------------
# "Llegue" solo se acepta si la ubicacion del conductor esta dentro de este radio del punto
# de recogida; la hora la pone el servidor. Con llegada verificada empieza la espera y la
# plataforma le reconoce de inmediato al conductor el cargo por cancelacion.
nexa.llegada.radio-metros=50

# --- Extra voluntario del pasajero (seccion 12A, modelo v2.2) ---------------
# Mientras la solicitud espera conductor, el pasajero puede sumar un extra para atraer a un
# conductor. Va completo al conductor: sin comision, sin descuento y sin XP; la plataforma ni
# gana ni pierde. Solo sube (nunca baja) y no excede el tope por viaje.
nexa.extra.tope=5000
nexa.extra.pasos=500,1000,2000

# --- Zona horaria del negocio ------------------------------------------------
# Reloj de las ventanas diarias, el factor del dia y las tareas programadas.
nexa.zona-horaria=America/Bogota

# --- Niveles: ventanas, inactividad y tareas (seccion 10 y 11) ---------------
# Un pasajero sin viajes validos durante estos dias baja al inicio del nivel anterior.
nexa.niveles.inactividad-dias=90
# Dias de antelacion con que se le avisa por correo que va a bajar de nivel.
nexa.niveles.aviso-inactividad-dias=15
# El XP del conductor cuenta solo los ultimos dias; sus metricas de calidad se cachean unos segundos.
nexa.conductor.ventana-dias=90
nexa.conductor.cache-stats-segundos=60
# Mantenimiento diario (inactividad y ventana de 90 dias) y reproceso de viajes sin niveles aplicados.
nexa.job.cron=0 15 3 * * *
nexa.job.reproceso-minutos=10
nexa.job.reproceso-dias=7
nexa.job.reproceso-gracia-minutos=2

# --- Despacho por olas ------------------------------------------------------
# Cada solicitud se avisa primero a los conductores cercanos y el radio crece con el tiempo. Los segundos cuentan
# desde que se solicita; un radio 0 significa toda la zona. Un conductor sin posicion vigente solo la ve en la ultima ola.
# Calibracion (oct 2026, flota de 10-40 conductores en linea, ~80 km2 urbanos): saltos de 25 s (deja ~15 s para leer
# la tarjeta y decidir) y tope de 6 km en la ultima ola (~19 min de recogida a 25 km/h con factor de ruta 1,3).
# Ajustar con las metricas del panel admin (GET /api/admin/despacho/metricas). Ver docs/niveles/DECISIONES.md.
nexa.despacho.ola-segundos=0,25,50,75
nexa.despacho.ola-radio-km=1.5,2.5,4,6
nexa.despacho.ubicacion-vigencia-segundos=45
# Olas que adelanta una solicitud con extra voluntario (0 = el extra no adelanta la ola).
nexa.despacho.olas-por-extra=1
# Minutos que se recuerda la ultima posicion de un conductor para contarlo como "en linea" aunque ya no reporte.
nexa.despacho.retencion-minutos=10
nexa.despacho.revision-segundos=5

# --- Punto de recogida ------------------------------------------------------
# El pasajero mueve el pin a donde quiere que lo recojan, pero no mas lejos de esto de su ubicacion GPS.
nexa.recogida.radio-max-metros=300

# --- Beneficios de servicio del pasajero (tabla de la seccion 10) ------------
# Segundos que una solicitud solo la ven conductores bien calificados, por nivel desde el 1.
nexa.beneficios.ventana-segundos=0,15,25,35,45
# Calificacion minima del conductor que ve la solicitud durante la ventana (nivel 6 en adelante la exige).
nexa.beneficios.calificacion-conductor=4.7
# Conductores favoritos: desde este nivel, y a cuantos minutos pueden estar (se amplian desde otro nivel).
nexa.beneficios.favoritos-desde-nivel=5
nexa.beneficios.favorito-eta-minutos=5
nexa.beneficios.favorito-ampliado-desde-nivel=7
nexa.beneficios.favorito-ampliado-eta-minutos=8
# Orden de la lista del conductor.
nexa.beneficios.peso-calificacion=1.0
nexa.beneficios.peso-cercania=1.0
nexa.beneficios.bono-favorito=2.0
nexa.beneficios.eta-max-minutos=15
nexa.beneficios.velocidad-kmh=25

# --- Seguimiento del pasajero hasta la recogida ------------------------------
# Mientras el conductor va en camino, el pasajero reporta su posicion (solo en memoria) y el conductor de
# ese viaje la ve. Una posicion mas vieja que esto se oculta (el pasajero cerro la pantalla o perdio senal).
nexa.seguimiento.vigencia-segundos=30

# --- Viaje en curso (seguimiento real) ---------------------------------------
# Para finalizar, el conductor debe estar a menos de este radio del destino (la posicion la pone el servidor).
nexa.viaje.radio-destino-metros=150
# false solo en desarrollo cuando el recorrido se simula (perfil dev); en produccion siempre true.
nexa.viaje.exigir-destino=true
# El conductor puede finalizar en cualquier tramo (la decide el, nunca el pasajero). Si lo hace sin llegar al destino:
# antes de este porcentaje de la distancia del viaje se cobra solo la fraccion indicada; desde ahi, el viaje completo.
nexa.viaje.umbral-cobro-completo=0.5
nexa.viaje.fraccion-cobro-anticipado=0.5
# Recorrido real: se guarda un punto cada vez que el conductor avanza al menos esto; tope de puntos por viaje.
nexa.viaje.punto-minimo-metros=20
nexa.viaje.max-puntos-recorrido=2000
# La posicion que vale para finalizar es la ultima que reporto el conductor (vigencia: nexa.despacho.ubicacion-vigencia-segundos).
