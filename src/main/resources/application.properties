spring.application.name=MotvirsWeb

# Carga opcional del archivo .env de la raiz del proyecto (solo desarrollo local; esta en .gitignore).
# Las variables de entorno reales del sistema tienen prioridad sobre el .env.
# Formato clave=valor, SIN comillas. Plantilla en .env.example
spring.config.import=optional:file:.env[.properties]

motvirs.model.path=modelo_satisfaccion_j48_v2.0.model

# ---------------------------------------------------------------------------
# SECRETOS: se leen SOLO de variables de entorno (o del .env local), sin valor por defecto.
# Si falta alguna la app no arranca (ver Config/EntornoObligatorioPostProcessor).
# Ver .env.example y docs/SEGURIDAD.md.
# ---------------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI}
jwt.secret=${JWT_SECRET}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

# Subida de fotos de documentos del conductor (4 fotos de hasta 5 MB al registrarse)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=22MB

# No sensible: URL publica para los enlaces de los correos (en produccion es obligatoria)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Logging seguro por defecto. El detalle (DEBUG/TRACE) vive en application-dev.properties
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
logging.level.com.example.MotvirsWeb.aplicacion.servicio.SatisfaccionClienteService=INFO
debug=false

# Errores sin stack traces ni mensajes internos hacia el cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Cookie de sesion
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Correo
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT (24 h). El secreto es una clave Base64 de al menos 256 bits.
jwt.expiration=86400000

# Limitador de intentos (ver Security/RateLimitFilter)
nexa.seguridad.rate-limit.habilitado=true

# Gemini AI Chatbot
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Verificacion de conductores (manual|mock|real). Claves solo por variables de entorno.
verification.provider=${VERIFICATION_PROVIDER:manual}
verification.real.base-url=${VERIFICATION_API_BASE_URL:}
verification.real.api-key=${VERIFICATION_API_KEY:}
verification.real.timeout-ms=${VERIFICATION_TIMEOUT_MS:5000}
verification.real.max-per-minute=${VERIFICATION_MAX_PER_MINUTE:30}
verification.require-verified-to-approve=${VERIFICATION_REQUIRE_VERIFIED:true}

# Revisión de conductores con información adicional (EN_REVISION)
verification.review-business-days=${VERIFICATION_REVIEW_BUSINESS_DAYS:15}
verification.review-cron=${VERIFICATION_REVIEW_CRON:0 30 6 * * *}
