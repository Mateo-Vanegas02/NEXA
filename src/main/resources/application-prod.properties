# Perfil de produccion: SPRING_PROFILES_ACTIVE=prod (hereda application.properties)
# Detras de proxy (Azure / nginx): respeta X-Forwarded-* para esquema HTTPS e IP de cliente
server.forward-headers-strategy=framework

# Cookie de sesion solo por HTTPS
server.servlet.session.cookie.secure=true

# En produccion la URL publica es obligatoria (sin valor por defecto)
app.base-url=${APP_BASE_URL}

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
