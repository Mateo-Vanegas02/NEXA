<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* Fondo Animado */
        body::before { content: ""; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(0, 196, 255, 0.05) 0%, transparent 70%); z-index: -1; animation: float 15s infinite alternate ease-in-out; }
        @keyframes float { 0% { transform: translate(0, 0); } 50% { transform: translate(-5%, 5%); } 100% { transform: translate(5%, -5%); } }

        .password-reset-container {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 196, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            padding: 50px 40px;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }
        
        .password-reset-container::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(to right, #00c4ff, #004F78); }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 36px;
            font-weight: 700;
            color: #00c4ff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 196, 255, 0.3);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .form-header p {
            font-size: 15px;
            color: #a6adc4;
            line-height: 1.6;
        }

        .alert {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
            background: rgba(30, 41, 59, 0.8);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-success {
            color: #00c4ff;
            border: 1px solid #00c4ff;
        }

        .alert-error {
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #00c4ff;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .input-container {
            position: relative;
        }

        .input-container input {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 15px;
            color: #fff;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.6);
        }

        .input-container input:focus {
            outline: none;
            border-color: #00c4ff;
            box-shadow: 0 0 10px rgba(0, 196, 255, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        .input-container input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00c4ff, #004080);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 196, 255, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .back-to-login {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .back-to-login a {
            color: #00c4ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .back-to-login a:hover {
            color: #fff;
            transform: translateX(-3px);
        }

        .back-to-login a::before {
            content: "←";
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a6adc4;
            font-size: 13px;
        }

        .feature-item i {
            color: #00c4ff;
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .password-reset-container {
                padding: 40px 25px;
                border-radius: 20px;
            }

            .logo h1 {
                font-size: 30px;
            }

            .form-header h2 {
                font-size: 24px;
            }

            .form-header p {
                font-size: 14px;
            }

            .features {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }

            .btn-submit {
                padding: 14px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<div class="password-reset-container">
    <div class="logo">
        <h1>NEXA</h1>
    </div>

    <div class="form-header">
        <h2>Recuperar Contraseña</h2>
        <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}">
        Enlace enviado exitosamente
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}">
        Error al enviar el enlace
    </div>

    <form class="password-form" th:action="@{/auth/forgot-password}" method="post">
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <div class="input-container">
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        required
                        autocomplete="email">
            </div>
        </div>

        <button type="submit" class="btn-submit">Enviar Enlace</button>
    </form>

    <div class="features">
        <div class="feature-item">
            <i>🔒</i>
            <span>Seguro</span>
        </div>
        <div class="feature-item">
            <i>⚡</i>
            <span>Rápido</span>
        </div>
        <div class="feature-item">
            <i>✓</i>
            <span>Confiable</span>
        </div>
    </div>

    <div class="back-to-login">
        <a th:href="@{/auth/login}">Volver al inicio de sesión</a>
    </div>
</div>
</body>
</html>
