<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificar viaje</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="/css/rating.css" rel="stylesheet">
    <link rel="icon" th:href="@{/icon/NEXA_ICO.ico}">
</head>
<body>
<main class="rating-container"
      th:attr="data-servicio-id=${servicioId}, data-rol=${rol}, data-nota-satisfecho=${notaSatisfecho}">
    <h1>Califica tu viaje</h1>
    <p class="rating-sub" th:text="${nombreOtro != null and !#strings.isEmpty(nombreOtro)}
        ? '¿Cómo te fue con ' + ${nombreOtro} + '? Es opcional.'
        : '¿Cómo te fue? Es opcional.'">¿Cómo te fue? Es opcional.</p>

    <div class="stars" id="stars" role="radiogroup" aria-label="Calificación de 1 a 5 estrellas">
        <button type="button" class="star" data-rating="1" role="radio" aria-checked="false" aria-label="1 estrella"><i class="far fa-star" aria-hidden="true"></i></button>
        <button type="button" class="star" data-rating="2" role="radio" aria-checked="false" aria-label="2 estrellas"><i class="far fa-star" aria-hidden="true"></i></button>
        <button type="button" class="star" data-rating="3" role="radio" aria-checked="false" aria-label="3 estrellas"><i class="far fa-star" aria-hidden="true"></i></button>
        <button type="button" class="star" data-rating="4" role="radio" aria-checked="false" aria-label="4 estrellas"><i class="far fa-star" aria-hidden="true"></i></button>
        <button type="button" class="star" data-rating="5" role="radio" aria-checked="false" aria-label="5 estrellas"><i class="far fa-star" aria-hidden="true"></i></button>
    </div>
    <p class="nota-texto" id="notaTexto" aria-live="polite"></p>

    <section class="factores" id="factores" hidden aria-labelledby="factoresTitulo">
        <h2 id="factoresTitulo">¿Qué falló?</h2>
        <div class="factores-lista">
            <button type="button" class="factor" hidden aria-pressed="false"
                    th:each="f : ${factores}"
                    th:attr="data-codigo=${f.codigo()}, data-positivo=${f.positivo()}"
                    th:text="${f.etiqueta()}">Factor</button>
        </div>
        <p class="factores-ayuda">Puedes marcar varios.</p>
    </section>

    <label class="sr-only" for="comentarios">Comentario</label>
    <textarea id="comentarios" maxlength="500" placeholder="Deja un comentario (opcional)"></textarea>

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <p class="rating-error" id="ratingError" role="alert"></p>

    <div class="rating-acciones">
        <button type="button" id="submitRating" disabled>Enviar calificación</button>
        <a class="rating-omitir" id="omitirRating" th:href="@{${urlPanel}}" href="/pasajero/panel">Ahora no</a>
    </div>
</main>
<script src="/js/calificacion-factores.js" defer></script>
<script src="/js/rating.js" defer></script>
</body>
</html>
