# NEXA con Docker Compose.
#   Producción / servidor:   docker compose up -d --build            (lee .env)
#   Con MongoDB local:       docker compose --profile local-db up -d --build
#                            (en .env: MONGODB_URI=mongodb://mongo:27017/nexa?replicaSet=rs0)
#   La app usa transacciones de MongoDB, que exigen un replica set: el Mongo local corre como
#   replica set de un nodo (rs0). Si la app corre fuera de Docker (./mvnw spring-boot:run) usa
#   MONGODB_URI=mongodb://localhost:27017/nexa?directConnection=true
# Variables: copia .env.example a .env y complétalo. NEXA_PROFILE=dev sirve para probar por http
# en local (el perfil prod exige HTTPS por la cookie Secure).
services:
  nexa-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexa-backend:latest
    container_name: nexa-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${NEXA_PROFILE:-prod}
      # Memoria de la JVM para un servidor de 2 GB
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseG1GC
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy
        required: false   # solo existe con --profile local-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  # MongoDB local opcional (desarrollo/pruebas). En producción se usa Atlas.
  mongo:
    image: mongo:7
    container_name: nexa-mongo
    profiles: ["local-db"]
    # Replica set de un nodo: sin él, las transacciones del flujo del viaje fallan.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - nexa-mongo-data:/data/db
    healthcheck:
      # Inicia el replica set la primera vez y solo queda sano cuando este nodo es primario.
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  nexa-mongo-data:
