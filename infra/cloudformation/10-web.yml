AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NEXA - fase 1. Servidor de la web: EC2 t3.small con Docker, IP fija, permisos y el repositorio
  ECR de la imagen. Sin SSH: se administra con SSM Session Manager. Los secretos los lee del
  Parameter Store (/nexa/prod) al desplegar; aqui no hay ninguno.

Parameters:
  ImagenBase:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 (x86_64), la version mas reciente
  TipoInstancia:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
  VersionCompose:
    Type: String
    Default: v2.29.7
    Description: Version del plugin docker compose que se instala en el servidor

Resources:
  RepoWeb:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: nexa-backend
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"solo las 10 ultimas",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
            "action":{"type":"expire"}}]}
      Tags:
        - { Key: proyecto, Value: nexa }

  GrupoSeguridad:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: nexa-web
      GroupDescription: NEXA web - solo HTTP y HTTPS desde internet (sin SSH)
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP (Caddy redirige a HTTPS) }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
      Tags:
        - { Key: proyecto, Value: nexa }

  RolServidor:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nexa-servidor
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: leer-parametros-de-la-web
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nexa/prod
      Tags:
        - { Key: proyecto, Value: nexa }

  PerfilServidor:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: nexa-servidor
      Roles: [!Ref RolServidor]

  PlantillaLanzamiento:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: nexa-servidor
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required          # IMDSv2
          HttpPutResponseHopLimit: 2    # para que los contenedores lleguen a las credenciales si hiciera falta

  Servidor:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImagenBase
      InstanceType: !Ref TipoInstancia
      IamInstanceProfile: !Ref PerfilServidor
      SecurityGroupIds: [!GetAtt GrupoSeguridad.GroupId]
      LaunchTemplate:
        LaunchTemplateId: !Ref PlantillaLanzamiento
        Version: !GetAtt PlantillaLanzamiento.LatestVersionNumber
      CreditSpecification:
        CPUCredits: standard            # sin cobros extra por CPU (modo ilimitado apagado)
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: nexa-servidor }
        - { Key: proyecto, Value: nexa }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          # Docker y el plugin compose
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/${VersionCompose}/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          # 2 GB de swap: la web usa hasta 1 GB de heap y el servidor tiene 2 GB de RAM
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          # Carpeta del despliegue (la llena GitHub Actions por SSM)
          mkdir -p /opt/nexa
          chmod 750 /opt/nexa
          echo "listo" > /opt/nexa/servidor-preparado

  IpFija:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Servidor
      Tags:
        - { Key: Name, Value: nexa-servidor }
        - { Key: proyecto, Value: nexa }

Outputs:
  IpPublica:
    Description: IP fija del servidor (autorizarla en MongoDB Atlas)
    Value: !Ref IpFija
  DireccionPrueba:
    Description: Direccion con HTTPS mientras no haya dominio propio (sslip.io)
    Value: !Join ['', [!Join ['-', !Split ['.', !Ref IpFija]], '.sslip.io']]
  IdServidor:
    Value: !Ref Servidor
  RepositorioImagen:
    Value: !GetAtt RepoWeb.RepositoryUri
