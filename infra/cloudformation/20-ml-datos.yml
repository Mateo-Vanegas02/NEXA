AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NEXA - fase 3. Datos del modelo de satisfaccion (TensorFlow): bucket S3 privado con las
  exportaciones de viajes y los modelos publicados, y la tabla DynamoDB con el estado y el
  historial de los entrenamientos. Solo la app (panel del admin) usa esta parte.

Resources:
  BucketMl:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain          # los modelos publicados no se borran si se elimina la pila
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub nexa-ml-${AWS::AccountId}
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: exportaciones-90-dias       # los viajes exportados se regeneran; no hace falta guardarlos siempre
            Status: Enabled
            Prefix: exportaciones/
            ExpirationInDays: 90
          - Id: subidas-incompletas
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      Tags:
        - { Key: proyecto, Value: nexa }

  PoliticaBucket:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketMl
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SoloHttps
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt BucketMl.Arn
              - !Sub '${BucketMl.Arn}/*'
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }

  TablaEntrenamientos:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nexa-entrenamientos
      BillingMode: PAY_PER_REQUEST    # se paga por uso: centavos con este volumen
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      Tags:
        - { Key: proyecto, Value: nexa }

Outputs:
  Bucket:
    Value: !Ref BucketMl
  Tabla:
    Value: !Ref TablaEntrenamientos
