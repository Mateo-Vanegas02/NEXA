# Integracion continua: compila y corre los tests en cada push a una rama distinta de master.
# NO despliega nada (el despliegue a Azure vive en master_nexa.yml) y no usa secretos:
# los tests usan los valores ficticios definidos en el pom.xml.
name: CI

on:
  push:
    branches-ignore:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mongo-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Pruebas con MongoDB desechable
        run: mvn -B -Dtest=Phase3MongoIntegrationTest -Dexcluded.groups=none test

  mongo-local-replica:
    # El Mongo de docker-compose debe admitir transacciones (replica set rs0).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Levantar el Mongo local de docker-compose
        run: |
          touch .env
          docker compose --profile local-db up -d --wait --wait-timeout 120 mongo
      - name: Confirmar replica set y una transacción
        run: |
          docker compose exec -T mongo mongosh --quiet --eval '
            if (!db.hello().isWritablePrimary) { quit(1) }
            const s = db.getMongo().startSession();
            s.startTransaction();
            s.getDatabase("ci_transaccion").prueba.insertOne({ ok: 1 });
            s.commitTransaction();
            print("transaccion ok, setName=" + db.hello().setName);'
      - name: Script de inspección de Atlas sobre datos sintéticos (solo lectura)
        run: |
          docker compose cp scripts/atlas/inspeccion-solo-lectura.js mongo:/tmp/inspeccion.js
          docker compose cp scripts/atlas/prueba/sembrar-datos-sinteticos.js mongo:/tmp/sembrar.js
          docker compose exec -T mongo mongosh --quiet --eval 'var BASE="nexa_inspeccion_ci"' --file /tmp/sembrar.js
          hash() { docker compose exec -T mongo mongosh --quiet --eval 'print(db.getSiblingDB("nexa_inspeccion_ci").runCommand({dbHash: 1}).md5)'; }
          antes=$(hash)
          docker compose exec -T mongo mongosh --quiet --eval 'var BASE="nexa_inspeccion_ci"' --file /tmp/inspeccion.js > inspeccion.json
          despues=$(hash)
          test "$antes" = "$despues" || { echo "La inspección modificó la base"; exit 1; }
          node scripts/atlas/prueba/verificar-salida.mjs inspeccion.json

      - name: Script de índices propuestos (plan, guardia de producción, crear y revertir en la base de prueba)
        run: |
          docker compose cp scripts/atlas/indices-propuestos.js mongo:/tmp/indices.js
          run() { docker compose exec -T mongo mongosh --quiet --eval "$1" --file /tmp/indices.js; }
          if run 'var BASE="motvirsweb"; var MODO="crear"' > guardia.txt 2>&1; then echo "La guardia de producción no frenó"; exit 1; fi
          grep -q "PRODUCCION_APROBADA" guardia.txt
          run 'var BASE="nexa_inspeccion_ci"; var MODO="plan"' > plan.json
          run 'var BASE="nexa_inspeccion_ci"; var MODO="crear"' > crear.json
          run 'var BASE="nexa_inspeccion_ci"; var MODO="revertir"' > revertir.json
          node scripts/atlas/prueba/verificar-indices.mjs plan.json crear.json revertir.json

      - name: Diagnóstico de tarjeta repetida (solo lectura, sin valores en la salida)
        run: |
          docker compose cp scripts/atlas/diagnostico-tarjeta-repetida.js mongo:/tmp/diagnostico.js
          docker compose exec -T mongo mongosh --quiet --eval 'var BASE="nexa_inspeccion_ci"' --file /tmp/diagnostico.js > diagnostico.json
          node scripts/atlas/prueba/verificar-diagnostico.mjs diagnostico.json

      - name: Script de correcciones de datos (plan, guardia, aplicar y revertir el archivo en la base de prueba)
        run: |
          docker compose cp scripts/atlas/correcciones-datos-fase3-2.js mongo:/tmp/correcciones.js
          run() { docker compose exec -T mongo mongosh --quiet --eval "$1" --file /tmp/correcciones.js; }
          if run 'var BASE="motvirsweb"; var MODO="aplicar"' > guardia2.txt 2>&1; then echo "La guardia de producción no frenó"; exit 1; fi
          grep -q "PRODUCCION_APROBADA" guardia2.txt
          run 'var BASE="nexa_inspeccion_ci"' > c-plan.json
          run 'var BASE="nexa_inspeccion_ci"; var MODO="aplicar"' > c-aplicar.json
          run 'var BASE="nexa_inspeccion_ci"' > c-despues.json
          run 'var BASE="nexa_inspeccion_ci"; var MODO="revertir-archivo"' > c-revertir.json
          node scripts/atlas/prueba/verificar-correcciones.mjs c-plan.json c-aplicar.json c-despues.json c-revertir.json

      - name: Rechazo de conductores de prueba con tarjeta repetida (plan, guardia, aplicar, repetir, revertir)
        run: |
          docker compose cp scripts/atlas/rechazar-conductores-prueba.js mongo:/tmp/rechazar.js
          ids=$(docker compose exec -T mongo mongosh --quiet --eval 'print(db.getSiblingDB("nexa_inspeccion_ci").Usuarios.find({rol: "CONDUCTOR", tarjeta_de_propiedad: 700001}).toArray().map(u => u._id.toHexString()).join(","))')
          otro=$(docker compose exec -T mongo mongosh --quiet --eval 'print(db.getSiblingDB("nexa_inspeccion_ci").Usuarios.findOne({rol: "PASAJERO"})._id.toHexString())')
          run() { docker compose exec -T mongo mongosh --quiet --eval "var BASE='nexa_inspeccion_ci'; $1" --file /tmp/rechazar.js; }
          if docker compose exec -T mongo mongosh --quiet --eval "var CONDUCTORES='$ids'; var MODO='aplicar'" --file /tmp/rechazar.js > g3.txt 2>&1; then echo "La guardia de producción no frenó"; exit 1; fi
          grep -q "PRODUCCION_APROBADA" g3.txt
          if run "var CONDUCTORES='$ids,$otro'" > g4.txt 2>&1; then echo "Aceptó un id que no es conductor"; exit 1; fi
          grep -q "no es un conductor" g4.txt
          run "var CONDUCTORES='$ids'" > r-plan.json
          run "var CONDUCTORES='$ids'; var MODO='aplicar'" > r-aplicar.json
          run "var CONDUCTORES='$ids'; var MODO='aplicar'" > r-repetir.json
          run "var CONDUCTORES='$ids'; var MODO='revertir'" > r-revertir.json
          run "var CONDUCTORES='$ids'" > r-tras-revertir.json
          node scripts/atlas/prueba/verificar-rechazo.mjs r-plan.json r-aplicar.json r-repetir.json r-revertir.json r-tras-revertir.json

      - name: Apagar
        if: always()
        run: docker compose --profile local-db down -v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: |
          set -o pipefail
          mvn -B clean install 2>&1 | tee build.log

      # Los errores de compilación solo viven en el log del job, que no siempre se puede abrir:
      # se repiten como anotaciones para verlos desde la propia lista de checks.
      - name: Errores de compilación en anotaciones
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "^\[ERROR\].*\.java" build.log | head -20 | while IFS= read -r linea; do
            echo "::error title=Compilacion::$(echo "$linea" | tr -d '%' | cut -c1-400)"
          done

      - name: Resumen de fallos en anotaciones
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -q -E "FAILURE|ERROR" "$f"; then
              echo "::error title=$(basename "$f")::$(head -c 1500 "$f" | tr '\n' ' ' | tr -d '%')"
            fi
          done

      - name: Totales de tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob,re
          t=f=e=sk=0
          for p in glob.glob('target/surefire-reports/*.txt'):
              m=re.search(r'Tests run: (\d+), Failures: (\d+), Errors: (\d+), Skipped: (\d+)',open(p).read())
              if m: a,b,c,d=map(int,m.groups()); t+=a;f+=b;e+=c;sk+=d
          print(f"::notice title=Tests::run={t} failures={f} errors={e} skipped={sk}")
          PY

      # Los reportes solo se suben si fallaron pruebas y la subida nunca tumba el CI: la cuota de
      # almacenamiento de artefactos del plan gratuito (500 MB acumulados por mes) se agota rápido.
      # Los totales y los fallos ya quedan en el resumen y en las anotaciones del run.
      - name: Subir reportes de tests
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # Construye la imagen de producción y comprueba que arranca (usuario sin privilegios + responde HTTP).
  # Usa una MongoDB desechable y valores ficticios: no toca Atlas ni usa secretos.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen
        run: docker build -t nexa-backend:ci .

      - name: Prueba de arranque
        run: |
          docker run -d --name mongo --network host mongo:7
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -qx 1; then break; fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -qx 1
          docker run -d --name nexa --network host \
            -e MONGODB_URI=mongodb://localhost:27017/nexa_ci \
            -e JWT_SECRET=dGVzdC1qd3Qtc2VjcmV0LW5vLXJlYWwtMDEyMzQ1Njc4OWFiY2RlZg== \
            -e GEMINI_API_KEY=test-gemini-key \
            -e SPRING_MAIL_USERNAME=test@example.com \
            -e SPRING_MAIL_PASSWORD=test-mail-password \
            -e APP_BASE_URL=http://localhost:8080 \
            nexa-backend:ci
          code=000
          for i in $(seq 1 50); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            if [ "$code" = 200 ] || [ "$code" = 302 ]; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' nexa)" != true ]; then break; fi
            sleep 3
          done
          if [ "$code" != 200 ] && [ "$code" != 302 ]; then
            echo "::error title=Docker::la aplicación no respondió (HTTP=$code)"
            docker inspect -f 'Estado={{.State.Status}} Codigo={{.State.ExitCode}} OOM={{.State.OOMKilled}}' nexa
            docker logs nexa 2>&1 | tail -100
            exit 1
          fi
          usuario=$(docker exec nexa id -un)
          echo "::notice title=Docker::HTTP=$code usuario=$usuario"
          if [ "$usuario" = root ]; then
            echo "::error title=Docker::el contenedor corre como root"
            exit 1
          fi
