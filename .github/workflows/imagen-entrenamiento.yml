# Construye la imagen de la entrenadora (ml/Dockerfile.entrenamiento) y la sube a ECR nexa-entrenamiento.
# La tarea de Fargate (pila nexa-40-ml-entrenamiento) usa la etiqueta :latest al lanzarse.
# Sin artefactos de Actions (cuota del plan gratuito). Credenciales: usuario IAM nexa-github-deploy.
name: Imagen entrenamiento

on:
  workflow_dispatch:   # a mano (Actions → Imagen entrenamiento → Run workflow), después de crear la pila nexa-40

permissions:
  contents: read

concurrency:
  group: imagen-entrenamiento
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  REGISTRO: 040666550968.dkr.ecr.us-east-2.amazonaws.com
  REPOSITORIO: nexa-entrenamiento

jobs:
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Construir y subir la imagen
        uses: docker/build-push-action@v6
        with:
          context: ml
          file: ml/Dockerfile.entrenamiento
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRO }}/${{ env.REPOSITORIO }}:${{ github.sha }}
            ${{ env.REGISTRO }}/${{ env.REPOSITORIO }}:latest
          cache-from: type=gha,scope=entrenamiento
          cache-to: type=gha,mode=max,scope=entrenamiento
