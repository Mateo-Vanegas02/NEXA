# CI de la app Flutter (carpeta mobile/): genera textos, revisa formato, analiza y corre pruebas.
# No firma ni distribuye nada (eso sigue en tool/distribuir.ps1) y no usa secretos.
name: Mobile

on:
  push:
    branches:
      - app
      - 'feature/flutter-**'
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Java para compilar el APK de verificación (maplibre_gl pide JDK 21)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Dependencias
        run: flutter pub get

      # Los textos generados (lib/core/l10n/gen), los modelos freezed/json y el formato se versionan. Si el
      # código subido no coincide, el parche se imprime en el log (comprimido en
      # base64 entre marcas) para aplicarlo con `git apply`. No se suben artefactos
      # porque la cuota de almacenamiento de Actions es limitada.
      - name: Textos generados y formato
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          dart format lib test
          # Archivos generados nuevos (p. ej. un *.g.dart) también entran al parche.
          git add -N .
          if ! git diff --quiet; then
            echo "::warning title=Ajustes::Formato o textos generados distintos; parche en el log"
            git diff --stat
            echo "PARCHE-INICIO $(git diff | gzip -9 | base64 -w0) PARCHE-FIN"
          fi
          # Los generados se versionan: si faltan, la app no compila en un
          # equipo sin build_runner (como el de desarrollo). Eso sí falla.
          if ! git diff --quiet -- '*.g.dart' '*.freezed.dart' lib/core/l10n/gen; then
            echo "::error title=Generados desactualizados::Aplica el parche del log (código generado sin versionar)"
            exit 1
          fi

      - name: Análisis
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        # Una prueba colgada falla a los 3 min en vez de los 10 por defecto.
        run: flutter test --reporter expanded --timeout 3m

      # Capturas de las pantallas (PNG en base64 en el log, sin artefactos) para
      # compararlas con el Figma del rediseño. No bloquean la CI.
      - name: Capturas
        if: success() || failure()
        continue-on-error: true
        env:
          NEXA_CAPTURAS: '1'
        run: flutter test test/capturas --reporter expanded --timeout 3m

      # Compila el APK debug (sin firmar con la clave real ni subirlo) para detectar a tiempo errores
      # de Gradle, del manifiesto o de plugins nativos que el análisis de Dart no ve.
      - name: Compilación Android (debug)
        shell: bash
        run: |
          registro="$RUNNER_TEMP/compilacion-android.log"
          flutter build apk --debug 2>&1 | tee "$registro" && exit 0
          codigo=$?
          if ! grep -qi 'status code 429' "$registro"; then
            exit "$codigo"
          fi
          echo "::warning::El repositorio de dependencias limitó las descargas. Se reintentará en 60 segundos."
          sleep 60
          flutter build apk --debug
