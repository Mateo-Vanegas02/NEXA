name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan new commits with Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl -fsSLo checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          grep " gitleaks_${version}_linux_x64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            range="$BEFORE_SHA..$GITHUB_SHA"
          else
            range="$(git merge-base origin/main HEAD)..HEAD"
          fi
          ./gitleaks --redact=100 --log-level error git --log-opts="$range" .
